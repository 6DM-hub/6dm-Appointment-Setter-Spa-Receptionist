name: Cara booking and consultation regression tests

on:
  pull_request:
    branches:
      - codex/cara-grok-ara
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/cara-regressions.yml'
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Fake local-only Twilio values: avoid loading real secrets or making calls.
    env:
      TWILIO_ACCOUNT_SID: AC00000000000000000000000000000000
      TWILIO_AUTH_TOKEN: test-token-not-a-real-credential
      TWILIO_PHONE_NUMBER: '+15551234567'
      TWILIO_VALIDATE_SIGNATURE: 'false'
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Run booking and consultation regression suite
        run: |
          python -m pytest -q \
            tests/test_cara_facial_booking_regression.py \
            tests/test_cara_customer_memory.py \
            tests/test_universal_service_booking.py \
            tests/test_consultation_gate.py \
            tests/test_realtime_consultation_enforcement.py \
            tests/test_realtime_facial_permission_flow.py \
            tests/test_realtime_request_memory.py \
            tests/test_booking_confirmation_text_recovery.py \
            tests/test_greeting_once_per_call.py \
            tests/test_temporal_grounding_backend.py
      - name: Run complete backend suite
        run: python -m pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Typecheck and build
        run: npm run build
