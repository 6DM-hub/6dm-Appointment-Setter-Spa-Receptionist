services:
  postgres:
    image: postgres:16-alpine
    container_name: 6dm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sixdm_db}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sixdm_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - 6dm_network

  redis:
    image: redis:7-alpine
    container_name: 6dm_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - 6dm_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: 6dm_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - 6dm_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: 6dm_frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:8000}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - 6dm_network

networks:
  6dm_network:
    driver: bridge
